name: CI
'on':
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  build-dita:
    name: Build ${{ matrix.theme }} Theme
    runs-on: ubuntu-latest
    strategy:
      matrix:
        theme: [default, cyborg, vapor, quartz, pulse, flatly]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Git checkout DTD Specialization
        uses: actions/checkout@v7
        with:
          repository: dita-bootstrap/dita-bootstrap.dtd
          ref: develop
          path: specialization

      - name: Copy Sample folder
        run: cp -R specialization/sample sample

      - name: Build Theme
        uses: dita-ot/dita-ot-action@4.4
        with:
          install: |
            apt-get update -q
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -qy --no-install-recommends nodejs libfontconfig1
            nodejs -v
          plugins: |
            fox.jason.extend.css
            https://github.com/dita-bootstrap/dita-bootstrap.dtd/archive/develop.zip
            https://github.com/jason-fox/fox.jason.prismjs/archive/master.zip
            https://github.com/dita-bootstrap/dita-bootstrap.pdf/archive/develop.zip
            https://github.com/dita-bootstrap/dita-bootstrap.pdf.theme/archive/develop.zip
          project: .github/dita-ot/${{ matrix.theme }}.xml

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.theme }}
          path: out/pdf

  swatch:
    name: Swatch ${{ matrix.theme }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        theme:
          [
            brite,
            cerulean,
            cosmo,
            cyborg,
            darkly,
            default,
            flatly,
            journal,
            litera,
            lumen,
            lux,
            materia,
            minty,
            morph,
            none,
            pulse,
            quartz,
            sandstone,
            simplex,
            sketchy,
            slate,
            solar,
            spacelab,
            superhero,
            united,
            vapor,
            yeti,
            zephyr,
          ]
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Git checkout DTD Specialization
        uses: actions/checkout@v7
        with:
          repository: dita-bootstrap/dita-bootstrap.dtd
          ref: develop
          path: specialization

      - name: Git checkout PDF
        uses: actions/checkout@v7
        with:
          repository: dita-bootstrap/dita-bootstrap.pdf
          ref: develop
          path: pdf

      - name: Prepare swatch
        run: python3 .github/scripts/swatch.py prepare ${{ matrix.theme }} pdf specialization swatch

      - name: Build swatch
        uses: dita-ot/dita-ot-action@4.4
        with:
          install: |
            apt-get update -q
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -qy --no-install-recommends nodejs libfontconfig1
            nodejs -v
          plugins: |
            fox.jason.extend.css
            https://github.com/dita-bootstrap/dita-bootstrap.dtd/archive/develop.zip
            https://github.com/jason-fox/fox.jason.prismjs/archive/master.zip
            https://github.com/dita-bootstrap/dita-bootstrap.pdf/archive/develop.zip
            https://github.com/dita-bootstrap/dita-bootstrap.pdf.theme/archive/develop.zip
          project: swatch/project.xml

      - name: Upload swatch
        uses: actions/upload-artifact@v7
        with:
          name: swatch-${{ matrix.theme }}
          path: out/pdf/swatch.pdf

  publish-swatches:
    name: Publish swatches.pdf
    needs: swatch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Download swatches
        uses: actions/download-artifact@v7
        with:
          pattern: swatch-*
          path: parts

      - name: Install merge dependencies
        run: pip install pypdf reportlab

      - name: Merge swatches
        run: |
          mkdir site
          python3 .github/scripts/swatch.py merge parts site/swatches.pdf
          echo '<!DOCTYPE html><meta charset="utf-8"><title>Swatches</title><a href="swatches.pdf">swatches.pdf</a>' > site/index.html

      - name: Deploy swatches 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: site
          commit-message: '🚀 Deploy swatches ${{ github.sha }}'
          git-config-name: 'GitHub Action'
          git-config-email: 'action@github.com'
